name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si pusheas varias veces seguidas a una misma rama, cancela los runs viejos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx eslint .
      - run: npm run test:run
      - run: npm run build
